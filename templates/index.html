<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpranov AI - Academic Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #FAF8F5; /* Soft Light Golden Background */
        }
    </style>
</head>
<body class="text-amber-950 flex flex-col h-screen">

    <!-- Redesigned Golden Header -->
    <header class="bg-gradient-to-r from-amber-50 via-amber-100/60 to-amber-50 border-b border-amber-200/80 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-4">
            <!-- Logo Container (Loads static/logo.png with smooth SVG fallback) -->
            <div class="h-11 w-11 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center shadow-md shadow-amber-300/50 border border-amber-300 overflow-hidden flex-shrink-0">
                <img src="{{ url_for('static', filename='logo.png') }}" 
                     alt="Logo" 
                     class="h-full w-full object-cover" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                
                <div class="hidden text-white font-bold items-center justify-center h-full w-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6" />
                    </svg>
                </div>
            </div>

            <!-- Title & Subtitle Badge -->
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-extrabold text-amber-950 tracking-wide font-sans">PERPRANOV.AI</h1>
                    <span class="bg-amber-200/80 text-amber-900 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-300/60 uppercase tracking-wider">Tutor v2.0</span>
                </div>
                <p class="text-xs text-amber-800/80 font-medium">Multimodal Voice & Vision Academic Mentor</p>
            </div>
        </div>
        
        <!-- Voice Assistant Reply Toggle -->
        <button id="tts-toggle" type="button" class="bg-white/80 hover:bg-amber-100/80 text-amber-900 border border-amber-300/70 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm transition flex items-center gap-2">
            🔊 Voice Reply: <span id="tts-status" class="text-amber-600 font-bold">ON</span>
        </button>
    </header>

    <!-- Main Chat Feed Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-amber-500 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0 shadow-sm">AI</div>
            <div class="bg-white border border-amber-200/70 p-4 rounded-2xl shadow-sm max-w-xl text-amber-950">
                Hello! I am Perpranov AI. Ask me any question, upload an image for analysis, or click 🎤 to speak your question!
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="bg-amber-50/90 border-t border-amber-200/60 p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex items-center gap-3">
            <!-- Image Upload -->
            <label class="cursor-pointer bg-amber-100/80 hover:bg-amber-200/80 border border-amber-200/60 p-3 rounded-xl text-amber-800 flex items-center justify-center transition" title="Upload Image">
                📎 <input type="file" id="image-input" accept="image/*" class="hidden">
            </label>

            <!-- Speech Microphone Button -->
            <button type="button" id="mic-btn" class="bg-amber-100/80 hover:bg-amber-200/80 border border-amber-200/60 p-3 rounded-xl text-amber-800 flex items-center justify-center transition" title="Speak Question">
                🎤
            </button>

            <!-- Text Prompt Input -->
            <input type="text" id="query-input" placeholder="Ask any question or click 🎤 to speak..." class="flex-1 bg-white border border-amber-200 rounded-xl px-4 py-3 text-amber-950 placeholder-amber-700/50 focus:outline-none focus:ring-2 focus:ring-amber-400">
            
            <!-- Submit Button -->
            <button type="submit" id="send-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-6 py-3 rounded-xl shadow-md shadow-amber-200 transition">Send</button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('chat-form');
        const queryInput = document.getElementById('query-input');
        const imageInput = document.getElementById('image-input');
        const chatContainer = document.getElementById('chat-container');
        const micBtn = document.getElementById('mic-btn');
        const ttsToggle = document.getElementById('tts-toggle');
        const ttsStatus = document.getElementById('tts-status');

        let voiceOutputEnabled = true;

        ttsToggle.addEventListener('click', () => {
            voiceOutputEnabled = !voiceOutputEnabled;
            ttsStatus.textContent = voiceOutputEnabled ? "ON" : "OFF";
            ttsStatus.className = voiceOutputEnabled ? "text-amber-600 font-bold" : "text-amber-400 font-bold";
            if (!voiceOutputEnabled) window.speechSynthesis.cancel();
        });

        function speakText(text) {
            if (!voiceOutputEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            micBtn.addEventListener('click', () => {
                try {
                    micBtn.classList.add('bg-red-100', 'text-red-600', 'animate-pulse');
                    recognition.start();
                } catch (e) {
                    console.error("Mic error:", e);
                }
            });

            recognition.onresult = (event) => {
                queryInput.value = event.results[0][0].transcript;
                micBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
            };

            recognition.onerror = () => micBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
            recognition.onend = () => micBtn.classList.remove('bg-red-100', 'text-red-600', 'animate-pulse');
        } else {
            micBtn.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = queryInput.value.trim();
            const file = imageInput.files[0];

            if (!text && !file) return;

            let userHtml = `<div class="flex justify-end"><div class="bg-amber-500 text-white p-4 rounded-2xl max-w-xl shadow-sm">${text}`;
            if (file) userHtml += `<br><span class="text-xs italic text-amber-100">[Attached Image: ${file.name}]</span>`;
            userHtml += `</div></div>`;
            chatContainer.innerHTML += userHtml;

            queryInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3">
                    <div class="bg-amber-500 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0 shadow-sm">AI</div>
                    <div class="bg-white border border-amber-200/70 p-4 rounded-2xl shadow-sm text-amber-700/60 italic">Thinking...</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const formData = new FormData();
            formData.append('query', text);
            if (file) formData.append('image', file);
            imageInput.value = '';

            try {
                const res = await fetch('/ask_ai', { method: 'POST', body: formData });
                const data = await res.json();

                document.getElementById(loadingId)?.remove();
                const answer = data.response || "No response received.";

                chatContainer.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="bg-amber-500 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0 shadow-sm">AI</div>
                        <div class="bg-white border border-amber-200/70 p-4 rounded-2xl shadow-sm max-w-xl text-amber-950 whitespace-pre-wrap">${answer}</div>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                speakText(answer);
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById(loadingId)?.remove();
                chatContainer.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="bg-amber-500 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold flex-shrink-0 shadow-sm">AI</div>
                        <div class="bg-red-50 text-red-600 border border-red-200 p-4 rounded-2xl shadow-sm max-w-xl">Error communicating with backend server.</div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
