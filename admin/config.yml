backend:
  name: github
  repo: perpranovai/edu_ai
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "AI Pages"
    folder: "/"
    extension: "html"
    format: "frontmatter"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
